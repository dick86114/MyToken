name: RoutinUsage
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: ai.routin.usage-monitor
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
targets:
  RoutinUsage:
    type: application
    platform: macOS
    sources: [RoutinUsage]
    settings:
      base:
        PRODUCT_NAME: "Routin Usage"
        PRODUCT_MODULE_NAME: RoutinUsage
  RoutinUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources: [RoutinUsageTests]
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Routin Usage.app/Contents/MacOS/Routin Usage"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: RoutinUsage
schemes:
  RoutinUsage:
    build:
      targets:
        RoutinUsage: all
        RoutinUsageTests: [test]
    test:
      targets: [RoutinUsageTests]
