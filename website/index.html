    <script>
      (function () {
        try {
          var globalObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          if (!globalObj) return;

          var origFetch = globalObj.fetch;
          var currentFetch = typeof origFetch === 'function' ? origFetch.bind(globalObj) : origFetch;

          // Define getter and setter on window to allow external scripts/proxies to reassign window.fetch safely
          Object.defineProperty(globalObj, 'fetch', {
            get: function () {
              return currentFetch;
            },
            set: function (newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });

          // Defensively suppress any uncaught errors related to window.fetch getter
          globalObj.addEventListener(
            'error',
            function (event) {
              if (
                event &&
                event.message &&
                typeof event.message === 'string' &&
                event.message.indexOf('Cannot set property fetch of') !== -1
              ) {
                event.preventDefault();
                event.stopImmediatePropagation();
                return true;
              }
            },
            true
          );
        } catch (e) {
          // silently handle
        }
      })();
    </script>
