name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 输出 Xcode 版本
        run: xcodebuild -version
      - name: 安装 XcodeGen
        run: brew install xcodegen
      - name: 执行单元测试
        run: scripts/test.sh
      - name: 构建 DMG
        run: scripts/build-dmg.sh
      - name: 上传 DMG 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: MyRoutin-dmg
          path: build/dist/MyRoutin.dmg
          if-no-files-found: error
